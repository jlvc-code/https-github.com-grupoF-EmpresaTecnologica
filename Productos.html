<!DOCTYPE html>
<html lang="es">
<head>

<body>

            <button class="btn-comprar">Comprar</button>

            <span class="precio">$50.00</span>

            <span class="precio">$87.50</span>
            <button class="btn-comprar">Comprar</button>
